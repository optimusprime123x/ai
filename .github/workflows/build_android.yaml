  name: Build Android APK
  
  on:
    workflow_dispatch:
    push:
      branches: [ "main" ]
      paths:
        - 'Android/**'
    pull_request:
      branches: [ "main" ]
      paths:
        - 'Android/**'
  
  jobs:
    build_apk:
      name: Build Android APK
      runs-on: ubuntu-latest
      permissions:
        contents: write
      defaults:
        run:
          working-directory: ./Android/src
      steps:
        - name: Checkout the source code
          uses: actions/checkout@v3
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
        - name: Set up Gradle with caching
          uses: gradle/actions/setup-gradle@v4
        - name: Install Android SDK Platform 37
          run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
        - name: Build
          run: ./gradlew assembleRelease
        - name: Upload release APK
          uses: actions/upload-artifact@v4
          with:
            name: app-release
            path: Android/src/app/build/outputs/apk/release/app-release.apk
            if-no-files-found: error
        - name: Create GitHub release
          if: github.event_name != 'pull_request'
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
            APK_NAME="aiplayground-v$VERSION.apk"
            cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
            gh release create "v$VERSION" "$APK_NAME" \
              --title "AI Playground v$VERSION" \
              --notes "Automated release build of version $VERSION." \
              || gh release upload "v$VERSION" "$APK_NAME" --clobber
  
  
