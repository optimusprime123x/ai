name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches-ignore: [ "main" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android_debug.yaml'

jobs:
  build_debug_apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          # Also write the cache from feature branches, not just the default branch.
          cache-read-only: false
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      - name: Build
        run: ./gradlew assembleDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Android/src/app/build/outputs/apk/debug/app-debug.apk
