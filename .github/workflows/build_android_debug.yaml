name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches-ignore: [ "main" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android_debug.yaml'

jobs:
  build_debug_apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          # Also write the cache from feature branches, not just the default branch.
          cache-read-only: false
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      - name: Check model allowlist exists for this version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          FILE="../../model_allowlists/$(echo "$VERSION" | tr '.' '_').json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Missing model allowlist for app version $VERSION. The app loads its default model list from model_allowlists/$(echo "$VERSION" | tr '.' '_').json on the main branch; add it before bumping versionName."
            exit 1
          fi
          echo "Found model allowlist for version $VERSION"
      - name: Set up signing keystore
        # Decodes the shared signing keystore from the SIGNING_KEYSTORE_BASE64 repo secret so
        # CI builds all carry the same signature and install as updates over each other. When
        # the secret is not configured, gradle falls back to debug signing.
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p app/signing
            echo "$KEYSTORE_B64" | base64 -d > app/signing/shared.keystore
            echo "Signing keystore installed."
          else
            echo "SIGNING_KEYSTORE_BASE64 secret not set; using default debug signing."
          fi
      - name: Build
        run: ./gradlew assembleDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Android/src/app/build/outputs/apk/debug/app-debug.apk
